<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhangxinagrui's home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Yuanti SC", "YouYuan", "Hiragino Maru Gothic ProN",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: 12vh;
    }

    h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 14vh;
      width: 100%;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      text-decoration: none;
      color: #111111;
      background: #ffffff;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    /* 悬停时卡片内部变黑底白字 */
    .nav-item:hover {
      background: #111111;
      border-color: #111111;
      color: #ffffff;
    }

    .nav-item .label {
      font-size: 16px;
    }

    .nav-item .arrow {
      font-size: 14px;
      color: #999999;
      transition: color 0.2s ease;
    }

    .nav-item:hover .arrow {
      color: #ffffff;
    }

    footer {
      width: 100%;
      text-align: left;
      padding: 0 24px 24px;
      font-size: 13px;
      color: #aaaaaa;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
      header {
        padding-top: 8vh;
      }
      nav {
        padding: 24px 24px 10vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>zhangxinagrui's home</h1>
  </header>

  <nav>
    <div class="nav-list">
      <a class="nav-item" href="/blog/">
        <span class="label">博客 / Blog</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </nav>

  <footer>© zhangxinagrui</footer>
</body>
</html>
