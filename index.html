<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhangxinagrui's home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Yuanti SC", "YouYuan", "Hiragino Maru Gothic ProN",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: 12vh;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: #f5f5f5;
    }

    nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 14vh;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      text-decoration: none;
      color: #f5f5f5;
      background: transparent;
      transition: border-color 0.2s ease;
    }

    /* 卡片 hover：只描边，不填充 */
    .nav-item:hover {
      border-color: #ffffff;
      background: transparent;
    }

    .nav-item .label {
      font-size: 16px;
    }

    .nav-item .arrow {
      font-size: 14px;
      color: #777777;
      transition: color 0.2s ease;
    }

    .nav-item:hover .arrow {
      color: #ffffff;
    }

    footer {
      width: 100%;
      text-align: left;
      padding: 0 24px 24px;
      font-size: 13px;
      color: #666666;
      position: relative;
      z-index: 2;
    }

    /* 泡泡画布：覆盖全屏，不拦截鼠标 */
    #bubble-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
      header {
        padding-top: 8vh;
      }
      nav {
        padding: 24px 24px 10vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>zhangxinagrui's home</h1>
  </header>

  <nav>
    <div class="nav-list">
      <a class="nav-item" href="/blog/">
        <span class="label">博客 / Blog</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </nav>

  <footer>© zhangxinagrui</footer>

  <canvas id="bubble-canvas"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('bubble-canvas');
      const ctx = canvas.getContext('2d');
      const card = document.querySelector('.nav-item');
      const bubbles = [];
      const MAX_BUBBLES = 80;
      const OUTLINE_COLOR = 'rgba(255, 255, 255, 0.65)';
      const FILL_COLOR = 'rgba(255, 255, 255, 0.16)';
      const LINE_WIDTH = 1.5;

      let W = 0, H = 0, dpr = 1;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      function spawnBubble() {
        if (bubbles.length >= MAX_BUBBLES) return;
        const r = 4 + Math.random() * 20; // 半径 4~24
        bubbles.push({
          x: Math.random() * W,
          y: H + r + 10,
          r: r,
          speed: 0.2 + Math.random() * 1.3,
          drift: (Math.random() - 0.5) * 0.5
        });
      }

      // 圆与矩形是否相交
      function circleRectIntersect(cx, cy, r, rect) {
        const nx = Math.max(rect.left, Math.min(cx, rect.right));
        const ny = Math.max(rect.top, Math.min(cy, rect.bottom));
        const dx = cx - nx;
        const dy = cy - ny;
        return dx * dx + dy * dy < r * r;
      }

      let lastSpawn = performance.now();

      function frame(now) {
        // 持续生成
        if (now - lastSpawn > 100 + Math.random() * 180) {
          spawnBubble();
          lastSpawn = now;
        }

        // 清屏
        ctx.clearRect(0, 0, W, H);

        // 更新位置 & 移除飘出顶部的
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          b.y -= b.speed;
          b.x += b.drift;
          if (b.y + b.r < -20) {
            bubbles.splice(i, 1);
          }
        }

        const cardRect = card ? card.getBoundingClientRect() : null;

        // 1) 先画所有泡泡的实心部分
        ctx.fillStyle = FILL_COLOR;
        for (const b of bubbles) {
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2) 把「圆与卡片矩形的交集」挖空，再在该区域画圆弧轮廓
        if (cardRect) {
          const hits = bubbles.filter(b =>
            circleRectIntersect(b.x, b.y, b.r, cardRect)
          );

          if (hits.length > 0) {
            // 挖空交集区域（用 r + 线宽/2，给轮廓线留出空间）
            ctx.save();
            ctx.beginPath();
            ctx.rect(cardRect.left, cardRect.top, cardRect.width, cardRect.height);
            ctx.clip();
            ctx.globalCompositeOperation = 'destination-out';
            for (const b of hits) {
              ctx.beginPath();
              ctx.arc(b.x, b.y, b.r + LINE_WIDTH / 2, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();

            // 在框内画圆弧轮廓（只显示圆在矩形内的那一段弧）
            ctx.save();
            ctx.beginPath();
            ctx.rect(cardRect.left, cardRect.top, cardRect.width, cardRect.height);
            ctx.clip();
            ctx.strokeStyle = OUTLINE_COLOR;
            ctx.lineWidth = LINE_WIDTH;
            for (const b of hits) {
              ctx.beginPath();
              ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
