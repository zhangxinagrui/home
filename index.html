<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhangxinagrui's home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Yuanti SC", "YouYuan", "Hiragino Maru Gothic ProN",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: 18vh;
    }

    h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    nav {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 16vh;
      width: 100%;
    }

    .nav-box {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border: 1px solid #cfcfcf;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      text-decoration: none;
      color: #111111;
      background: #ffffff;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .nav-item:hover {
      border-color: #111111;
      background: #fafafa;
    }

    .nav-item .label {
      font-size: 16px;
    }

    .nav-item .arrow {
      font-size: 14px;
      color: #999999;
    }

    .nav-item:hover .arrow {
      color: #111111;
    }

    .cat {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 168px;
      height: auto;
      color: #111111;
      pointer-events: none;
      z-index: 10;
    }

    footer {
      width: 100%;
      text-align: left;
      padding: 0 24px 24px;
      font-size: 13px;
      color: #aaaaaa;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
      header {
        padding-top: 13vh;
      }
      nav {
        padding: 24px 20px 12vh;
      }
      .cat {
        width: 112px;
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>zhangxinagrui's home</h1>
  </header>

  <nav>
    <div class="nav-box">
      <a class="nav-item" href="/blog/">
        <span class="label">博客 / Blog</span>
        <span class="arrow">→</span>
      </a>

      <a class="nav-item" href="/relaxation/">
        <span class="label">放松 / Relaxation</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </nav>

  <footer>© zhangxinagrui</footer>

  <!-- 右下角：线条猫玩毛球 -->
  <svg class="cat" viewBox="0 0 140 100" fill="none"
       xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- 猫身体轮廓（蹲坐） -->
    <path d="M22 88 C18 66 24 50 42 44 C48 42 54 42 60 44 C68 47 72 54 72 62 C72 74 66 84 60 88"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="52" cy="34" r="14" stroke="currentColor" stroke-width="2"/>
    <!-- 两只耳朵 -->
    <path d="M42 24 L40 12 L50 20" stroke="currentColor" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M62 24 L64 12 L54 20" stroke="currentColor" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 尾巴 -->
    <path d="M22 82 C8 80 6 66 16 60" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"/>
    <!-- 伸出的前爪 -->
    <path d="M66 72 C78 70 87 73 92 77" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"/>
    <!-- 毛球 -->
    <circle cx="106" cy="80" r="11" stroke="currentColor" stroke-width="2"/>
    <!-- 毛球上的缠绕线 -->
    <path d="M97 74 C103 80 109 80 115 74" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round"/>
    <path d="M97 86 C103 80 109 80 115 86" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round"/>
    <!-- 毛球外伸的三根线头 -->
    <path d="M106 69 L106 64" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M118 76 L123 73" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M94 84 L89 87" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</body>
</html>
