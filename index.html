<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhangxinagrui's home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Yuanti SC", "YouYuan", "Hiragino Maru Gothic ProN",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: 16vh;
    }

    h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    nav {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 18vh;
      width: 100%;
    }

    /* 包住所有选项的大框 */
    .nav-box {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border: 1px solid #cfcfcf;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      text-decoration: none;
      color: #111111;
      background: #ffffff;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .nav-item:hover {
      border-color: #111111;
      background: #fafafa;
    }

    .nav-item .label {
      font-size: 16px;
    }

    .nav-item .arrow {
      font-size: 14px;
      color: #999999;
    }

    .nav-item:hover .arrow {
      color: #111111;
    }

    /* 页面右下角的黑猫 logo */
    .cat {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 150px;
      height: auto;
      pointer-events: none;
      z-index: 10;
    }

    footer {
      width: 100%;
      text-align: left;
      padding: 0 24px 24px;
      font-size: 13px;
      color: #aaaaaa;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
      header {
        padding-top: 12vh;
      }
      nav {
        padding: 24px 20px 14vh;
      }
      .cat {
        width: 96px;
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>zhangxinagrui's home</h1>
  </header>

  <nav>
    <div class="nav-box">
      <a class="nav-item" href="/blog/">
        <span class="label">博客 / Blog</span>
        <span class="arrow">→</span>
      </a>

      <a class="nav-item" href="/relaxation/">
        <span class="label">放松 / Relaxation</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </nav>

  <footer>© zhangxinagrui</footer>

  <!-- 右下角：黑猫玩毛线球 logo -->
  <svg class="cat" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true">
    <!-- 尾巴：从身体左侧卷起 -->
    <path d="M 42 170 C 8 164 6 126 26 114"
          fill="none" stroke="#111111" stroke-width="13" stroke-linecap="round"/>

    <!-- 身体：坐姿梨形 -->
    <path d="M 52 102
             C 28 118 26 162 44 178
             L 112 178
             C 130 162 128 118 104 102 Z"
          fill="#111111"/>

    <!-- 左耳 -->
    <path d="M 46 45 L 41 13 Q 40 8 45 11 L 68 31 Z" fill="#111111"/>

    <!-- 右耳 -->
    <path d="M 110 45 L 115 13 Q 116 8 111 11 L 88 31 Z" fill="#111111"/>

    <!-- 头 -->
    <circle cx="78" cy="70" r="44" fill="#111111"/>

    <!-- 伸向毛线球的前爪 -->
    <ellipse cx="126" cy="158" rx="16" ry="10"
             transform="rotate(-18 126 158)" fill="#111111"/>

    <!-- 眼睛 -->
    <ellipse cx="66" cy="66" rx="3.5" ry="5" fill="#ffffff"/>
    <ellipse cx="90" cy="66" rx="3.5" ry="5" fill="#ffffff"/>

    <!-- 毛线球：实心黑圆 -->
    <circle cx="170" cy="162" r="26" fill="#111111"/>

    <!-- 毛线缠绕纹路 -->
    <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
      <path d="M 150 148 Q 170 160 190 148"/>
      <path d="M 150 176 Q 170 164 190 176"/>
      <path d="M 158 142 Q 172 162 158 182"/>
      <path d="M 182 142 Q 168 162 182 182"/>
    </g>

    <!-- 毛线球线头 -->
    <path d="M 196 162 Q 208 160 214 152"
          fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  </svg>
</body>
</html>
