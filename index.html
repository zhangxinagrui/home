<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhangxinagrui's home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Yuanti SC", "YouYuan", "Hiragino Maru Gothic ProN",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: 12vh;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
      color: #f5f5f5;
    }

    nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 14vh;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      text-decoration: none;
      color: #f5f5f5;
      background: transparent;
      transition: border-color 0.2s ease;
    }

    /* 卡片 hover：只描边，不填充 */
    .nav-item:hover {
      border-color: #ffffff;
      background: transparent;
    }

    .nav-item .label {
      font-size: 16px;
    }

    .nav-item .arrow {
      font-size: 14px;
      color: #777777;
      transition: color 0.2s ease;
    }

    .nav-item:hover .arrow {
      color: #ffffff;
    }

    footer {
      width: 100%;
      text-align: left;
      padding: 0 24px 24px;
      font-size: 13px;
      color: #666666;
      position: relative;
      z-index: 2;
    }

    /* 泡泡装饰层，不拦截鼠标 */
    #bubble-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    /* 进入卡片框时：变成只有轮廓 */
    .bubble.outline {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
      header {
        padding-top: 8vh;
      }
      nav {
        padding: 24px 24px 10vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>zhangxinagrui's home</h1>
  </header>

  <nav>
    <div class="nav-list">
      <a class="nav-item" href="/blog/">
        <span class="label">博客 / Blog</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </nav>

  <footer>© zhangxinagrui</footer>

  <div id="bubble-layer"></div>

  <script>
    (function () {
      const layer = document.getElementById('bubble-layer');
      const card = document.querySelector('.nav-item');
      const bubbles = [];
      const COUNT = 12;

      function createBubble() {
        const size = 14 + Math.random() * 22; // 14~36px
        const el = document.createElement('div');
        el.className = 'bubble';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.left = Math.random() * 100 + '%';
        el.style.top = window.innerHeight + 'px';
        layer.appendChild(el);

        return {
          el,
          x: parseFloat(el.style.left) / 100 * window.innerWidth,
          y: window.innerHeight + size,
          size,
          speed: 0.35 + Math.random() * 0.65, // 上浮速度
          drift: (Math.random() - 0.5) * 0.3  // 水平轻微漂移
        };
      }

      for (let i = 0; i < COUNT; i++) {
        const b = createBubble();
        // 随机初始高度，避免全从底部一起出现
        b.y = window.innerHeight * (0.2 + Math.random() * 0.8);
        b.el.style.top = b.y + 'px';
        bubbles.push(b);
      }

      function isInsideCard(bubble) {
        if (!card) return false;
        const rect = card.getBoundingClientRect();
        const cx = bubble.x + bubble.size / 2;
        const cy = bubble.y + bubble.size / 2;
        return (
          cx > rect.left &&
          cx < rect.right &&
          cy > rect.top &&
          cy < rect.bottom
        );
      }

      function tick() {
        for (const b of bubbles) {
          b.y -= b.speed;
          b.x += b.drift;
          b.el.style.top = b.y + 'px';
          b.el.style.left = b.x + 'px';

          if (isInsideCard(b)) {
            b.el.classList.add('outline');
          } else {
            b.el.classList.remove('outline');
          }

          // 飘出顶部后重置到底部
          if (b.y + b.size < -20) {
            b.x = Math.random() * window.innerWidth;
            b.y = window.innerHeight + 20;
            b.size = 14 + Math.random() * 22;
            b.speed = 0.35 + Math.random() * 0.65;
            b.drift = (Math.random() - 0.5) * 0.3;
            b.el.style.width = b.size + 'px';
            b.el.style.height = b.size + 'px';
            b.el.style.left = b.x + 'px';
            b.el.style.top = b.y + 'px';
            b.el.classList.remove('outline');
          }
        }
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
