<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhangxinagrui's home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Yuanti SC", "YouYuan", "Hiragino Maru Gothic ProN",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: 18vh;
    }

    h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    nav {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 16vh;
      width: 100%;
    }

    .nav-box {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border: 1px solid #cfcfcf;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      text-decoration: none;
      color: #111111;
      background: #ffffff;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .nav-item:hover {
      border-color: #111111;
      background: #fafafa;
    }

    .nav-item .label {
      font-size: 16px;
    }

    .nav-item .arrow {
      font-size: 14px;
      color: #999999;
    }

    .nav-item:hover .arrow {
      color: #111111;
    }

    .cat {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 168px;
      height: auto;
      pointer-events: none;
      z-index: 10;
    }

    footer {
      width: 100%;
      text-align: left;
      padding: 0 24px 24px;
      font-size: 13px;
      color: #aaaaaa;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
      header {
        padding-top: 13vh;
      }
      nav {
        padding: 24px 20px 12vh;
      }
      .cat {
        width: 110px;
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>zhangxinagrui's home</h1>
  </header>

  <nav>
    <div class="nav-box">
      <a class="nav-item" href="/blog/">
        <span class="label">博客 / Blog</span>
        <span class="arrow">→</span>
      </a>

      <a class="nav-item" href="/relaxation/">
        <span class="label">放松 / Relaxation</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </nav>

  <footer>© zhangxinagrui</footer>

  <!-- 右下角：猫玩毛线球 logo（连贯剪影，非几何拼接） -->
  <svg class="cat" viewBox="0 0 250 200" xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true">
    <!-- 尾巴：从臀部绕出，一条完整的卷曲线 -->
    <path d="M 52 162
             C 30 166 12 152 12 132
             C 12 114 26 106 38 116
             C 44 121 42 129 35 127"
          fill="none" stroke="#111111" stroke-width="12" stroke-linecap="round"/>

    <!-- 猫的主体：头、耳、颈、背、臀、前胸、前腿，一条连贯路径 -->
    <path d="M 88 32
             C 96 24 104 24 110 30
             L 120 14
             Q 123 8 121 16
             L 112 38
             C 124 50 130 68 126 86
             C 124 98 118 106 112 112
             C 126 122 138 140 146 158
             C 154 162 162 166 170 168
             C 174 170 172 174 167 172
             C 158 168 150 168 144 172
             C 147 177 145 182 136 182
             L 68 182
             C 54 182 46 172 46 158
             C 46 144 50 128 58 116
             C 44 102 40 80 48 60
             C 52 48 58 38 66 32
             L 56 12
             Q 53 6 57 14
             L 76 30
             C 80 32 84 32 88 32 Z"
          fill="#111111"/>

    <!-- 毛线球：实心圆 -->
    <circle cx="198" cy="166" r="24" fill="#111111"/>

    <!-- 毛线缠绕纹路：用白色弧线表现 -->
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
      <path d="M 178 154 Q 198 166 218 154"/>
      <path d="M 178 178 Q 198 166 218 178"/>
      <path d="M 186 146 Q 200 166 186 186"/>
      <path d="M 210 146 Q 196 166 210 186"/>
    </g>

    <!-- 甩出去的线头 -->
    <path d="M 222 166 Q 234 162 242 152"
          fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  </svg>
</body>
</html>
