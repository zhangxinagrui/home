<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhangxinagrui's home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Yuanti SC", "YouYuan", "Hiragino Maru Gothic ProN",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      text-align: center;
      padding-top: 12vh;
    }

    h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    nav {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 14vh;
      width: 100%;
    }

    /* 包住所有选项的大框 */
    .nav-box {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border: 1px solid #cfcfcf;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      text-decoration: none;
      color: #111111;
      background: #ffffff;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .nav-item:hover {
      border-color: #111111;
      background: #fafafa;
    }

    .nav-item .label {
      font-size: 16px;
    }

    .nav-item .arrow {
      font-size: 14px;
      color: #999999;
    }

    .nav-item:hover .arrow {
      color: #111111;
    }

    /* 页面右下角的实心黑猫 */
    .cat {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 110px;
      height: 110px;
      pointer-events: none;
      z-index: 10;
    }

    footer {
      width: 100%;
      text-align: left;
      padding: 0 24px 24px;
      font-size: 13px;
      color: #aaaaaa;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
      header {
        padding-top: 8vh;
      }
      nav {
        padding: 24px 20px 10vh;
      }
      .cat {
        width: 80px;
        height: 80px;
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>zhangxinagrui's home</h1>
  </header>

  <nav>
    <div class="nav-box">
      <a class="nav-item" href="/blog/">
        <span class="label">博客 / Blog</span>
        <span class="arrow">→</span>
      </a>

      <a class="nav-item" href="/relaxation/">
        <span class="label">放松 / Relaxation</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </nav>

  <footer>© zhangxinagrui</footer>

  <!-- 右下角实心黑猫 -->
  <svg class="cat" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true">
    <!-- 尾巴：从身体左侧绕出，圆润收尾 -->
    <path d="M 40 120 C 15 120 12 98 28 92 C 36 89 42 95 40 102"
          fill="none" stroke="#111111" stroke-width="9" stroke-linecap="round"/>
    <!-- 身体：坐姿的椭圆 -->
    <ellipse cx="70" cy="108" rx="38" ry="28" fill="#111111"/>
    <!-- 头：圆润的实心圆 -->
    <circle cx="70" cy="56" r="30" fill="#111111"/>
    <!-- 左耳 -->
    <path d="M 47 36 L 41 12 L 63 30 Z" fill="#111111"/>
    <!-- 右耳 -->
    <path d="M 93 36 L 99 12 L 77 30 Z" fill="#111111"/>
  </svg>
</body>
</html>
